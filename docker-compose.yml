version: "3.8"

services:
  bot:
    build: .
    container_name: meowrobot_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./downloads:/app/downloads
    networks:
      - meow_network

  mongo:
    image: mongo:6.0
    container_name: meowrobot_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: meowbot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meow_network

  postgres:
    image: postgres:15-alpine
    container_name: meowrobot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meowuser
      POSTGRES_PASSWORD: meowpassword
      POSTGRES_DB: meowbot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowuser -d meowbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meow_network

volumes:
  mongo_data:
  pg_data:

networks:
  meow_network:
    driver: bridge
